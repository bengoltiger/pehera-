# Render blueprint — deploy the FastAPI backend to https://render.com
# Blueprint:  New +  → "Blueprint"  →  connect repo  →  apply.
# Manual works too with the standard fields:
#   build:   pip install -r requirements.txt
#   start:   cd backend && uvicorn app.main:app --host 0.0.0.0 --port ${PORT} --workers 1
# No "Root directory" setting is required: the root-level requirements.txt
# delegates to backend/requirements.txt and the start command cd's into backend.
services:
  - type: web
    name: pehra-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port ${PORT} --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PEHRA_ENVIRONMENT
        value: production
      - key: PEHRA_DEBUG
        value: "false"
      # Deterministic simulated data — the app never presents it as real.
      - key: PEHRA_DEMO_MODE
        value: "true"
      - key: PEHRA_JWT_SECRET
        generateValue: true
    # CORS defaults to * so the Vercel-frontend origin is allowed.